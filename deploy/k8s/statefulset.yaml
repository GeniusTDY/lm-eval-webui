apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lm-eval-webui
  namespace: lm-eval-webui
spec:
  serviceName: lm-eval-webui
  replicas: 1
  selector:
    matchLabels:
      app: lm-eval-webui
  template:
    metadata:
      labels:
        app: lm-eval-webui
    spec:
      containers:
        - name: webui
          image: savagemindz/lm-eval-webui:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 12Gi
          env:
            - name: OPENAI_BASE_URL
              value: http://localhost:11434/v1
            - name: HF_HOME
              value: /data/huggingface
            - name: HF_DATASETS_CACHE
              value: /data/huggingface/datasets
            - name: LMEVAL_WEBUI_HF_RETRIES
              value: "5"
            - name: LMEVAL_WEBUI_HF_RETRY_DELAY
              value: "10"
            - name: LMEVAL_WEBUI_HF_RETRY_MAX_DELAY
              value: "120"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: token
                  optional: true
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: token
                  optional: true
          command:
            - python
            - -m
            - lm_eval_webui
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --data-dir
            - /data
            - --static-dir
            - static
            - --max-request-workers
            - "16"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lm-eval-data